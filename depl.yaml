apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-depl
  labels:
    hi: "17368719771" 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-argo-app
  template:
    metadata:
      labels:
        app: test-argo-app
    spec:
      containers:
      - image: gcr.io/google-samples/gb-frontend:v4   #modify
        name: webserver-simple
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources: {}











